# Font Configuration
font_size 12.0

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Use nvim as the scrollback pager (neovim 0.12+, see pager.vim).
# A minimal init renders the piped buffer with nvim_open_term so ANSI colors are
# preserved, without loading the real nvim config. Opens at the bottom; full vim
# navigation works (j/k, gg/G, ctrl-d/ctrl-u, / search). q quits.
scrollback_pager nvim -u ${HOME}/.config/kitty/pager.vim --noplugin -i NONE -
scrollback_pager_history_size 100

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Font size
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# ── Vim-style keybindings ──────────────────────────────────────────────
# Layouts that support splits, so window navigation behaves like vim panes.
enabled_layouts splits,stack,tall,fat

# Create splits (and a new tab) — cwd inherited from the current window
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+backslash launch --location=hsplit --cwd=current
map ctrl+t new_tab

# Navigate splits — hjkl
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# Move splits around — alt+hjkl
map ctrl+alt+h move_window left
map ctrl+alt+j move_window down
map ctrl+alt+k move_window up
map ctrl+alt+l move_window right

# Resize splits — enter resize mode, then use hjkl/arrows, Esc to exit
map ctrl+shift+r start_resizing_window

# Window management
map ctrl+shift+w close_window
map ctrl+shift+z toggle_layout stack

# Tab navigation — n/p for next/previous
map ctrl+shift+n next_tab
map ctrl+shift+p previous_tab

# Scrolling — vim style (d/u half-ish page, g/G home/end)
map ctrl+shift+d scroll_page_down
map ctrl+shift+u scroll_page_up
map ctrl+shift+g scroll_home
map ctrl+shift+b scroll_end
map ctrl+shift+f show_scrollback

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf
